# ECHO, Docker Compose example (docs/TECHNICAL_ARCHITECTURE.md §6.4; finalised in M5).
# Copy to compose.yaml and adjust. Contains no secrets.
#
# Before the first start:
#   mkdir -p secrets && openssl rand -base64 32 > secrets/echo_master_key && chmod 600 secrets/echo_master_key
#   (owned by uid 1000, the container user). Back the key up separately from /data
#   (docs/SETTINGS_AND_SECURITY.md §11). The server refuses to start without it.

services:
  echo:
    build: .                                   # or image: ghcr.io/<owner>/echo:<version>
    image: echo:local
    restart: unless-stopped
    environment:
      ECHO_PUBLIC_ORIGIN: https://echo.example.com
      ECHO_PORT: "8080"
      ECHO_LOG: info
      # Required behind Caddy: the address Caddy's requests come from, as ECHO sees it (its IP on
      # the "web" network, or that network's gateway when Caddy runs on the host; IPv4 CIDRs work).
      # Left empty, ECHO trusts no X-Forwarded-Proto, sees plain http and answers 403 to everything.
      ECHO_TRUSTED_PROXY: ""
    secrets: [echo_master_key]
    volumes: [echo-data:/data]
    networks: [web, music]                     # no "ports:", reachable only via Caddy
    # Caddy on the host instead of in Docker? Drop the "web" network and publish on loopback
    # only, then point Caddy at 127.0.0.1:<port>. Pick a free host port:
    # ports: ["127.0.0.1:8085:8080"]
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A shared box (the OptiPlex runs Navidrome's transcoding too): peak RSS measured 213 MB with
    # three listeners (M9); Argon2id takes 64 MiB per sign-in; covers decode at up to 25 Mpx.
    mem_limit: 768m
    pids_limit: 256
    cpus: 2
    logging:                                   # Docker keeps logs forever otherwise
      options: { max-size: 10m, max-file: "3" }

secrets:
  echo_master_key:
    file: ./secrets/echo_master_key            # chmod 600, never in git

volumes:
  echo-data: {}

networks:
  web:                                         # shared with the Caddy container
    external: true
  music:                                       # shared with the existing Navidrome service
    external: true
