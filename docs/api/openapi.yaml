openapi: 3.1.0
info:
  title: ECHO API
  version: '1'
  description: >
    The ECHO server's API (docs/TECHNICAL_ARCHITECTURE.md §6.2), started in M5 for every route built
    so far. Same-origin JSON unless noted. Authentication is the `__Host-echo_session` cookie (web)
    or a `Bearer echo_dt_…` device token (native clients). Cookie-authenticated unsafe methods need
    `Origin` equal to ECHO's public origin (docs/SETTINGS_AND_SECURITY.md §5.3). Everything not in the
    unauthenticated list of §5.5 answers 401 without a session. On every route: 413 `too_large` for a
    body over 64 KB; 403 `totp_enrolment_required` while "require TOTP for all" is on and the user has
    no TOTP yet (only the Account routes answer); 400 for a body that is not a JSON object where one is
    read. A test (src/server/openapi.test.ts) keeps this file and the server's routes in step.
servers:
  - url: /api/v1
security:
  - session: []
  - device: []

paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }

  /csp-report:
    post:
      summary: 'Content-Security-Policy violation reports from browsers (report-uri): logged, never stored; 10 a minute per address, 300 in all'
      security: []
      requestBody:
        content: { application/csp-report: { schema: { type: object } }, application/json: { schema: { type: object } } }
      responses:
        '204': { description: Received }

  /session:
    get:
      summary: Who this browser is (never 401)
      security: []
      responses:
        '200':
          description: Signed in, anonymous, or setup open
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, username, role, navidrome]
                    properties:
                      status: { const: signedIn }
                      username: { type: string }
                      role: { enum: [admin, user] }
                      navidrome: { type: boolean, description: The user has a Navidrome connection }
                      mustEnrolTotp: { type: boolean, description: '"Require TOTP for all" is on and this user has none yet' }
                      youtube:
                        type: object
                        description: YouTube Music mode (the admin switch, and whether this user saved a sign-in)
                        properties: { enabled: { type: boolean }, signedIn: { type: boolean } }
                  - type: object
                    properties: { status: { enum: [anonymous, setup] } }

  /setup:
    get:
      summary: Whether the one-time admin setup is open
      security: []
      responses:
        '200': { description: Open, content: { application/json: { schema: { type: object, properties: { open: { const: true } } } } } }
        '404': { description: An admin exists }
    post:
      summary: 'Setup step 1: admin username and password; returns the TOTP key to enrol'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string, description: The setup token from the server log (the URL fragment) }
                username: { type: string, pattern: '^[\w.-]{1,64}$' }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: TOTP enrolment
          content: { application/json: { schema: { type: object, properties: { otpauth: { type: string }, secret: { type: string } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { description: Wrong or expired token, or an admin exists }

  /setup/totp:
    post:
      summary: 'Setup step 2: a valid TOTP code creates the admin; recovery codes are shown once'
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, code], properties: { token: { type: string }, code: { type: string } } } } }
      responses:
        '200':
          description: Admin created and signed in (sets the session cookie)
          content: { application/json: { schema: { type: object, properties: { recoveryCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { description: Wrong or expired token }

  /auth/login:
    post:
      summary: Password step of signing in
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } } } }
      responses:
        '200':
          description: A session (cookie set, totpRequired false) or a TOTP challenge
          content:
            application/json:
              schema: { type: object, properties: { totpRequired: { type: boolean }, challenge: { type: string } } }
        '401': { description: Username or password is incorrect (also while locked) }
        '429': { description: Rate limited (10/min, 100/day per client address) }

  /auth/totp:
    post:
      summary: Second factor (a 6-digit code or a recovery code)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challenge, code], properties: { challenge: { type: string }, code: { type: string } } } } }
      responses:
        '200': { description: Signed in (cookie set) }
        '401': { description: bad_code or challenge_expired }
        '429': { description: Rate limited }

  /auth/device:
    post:
      summary: 'A device token for a native client (SETTINGS_AND_SECURITY.md §4.6): credentials and, when enabled, the TOTP or recovery code in one request'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name]
              properties:
                username: { type: string }
                password: { type: string }
                code: { type: string, description: TOTP or recovery code (required when the account has TOTP) }
                name: { type: string, maxLength: 64, description: 'Shown in Sessions & devices' }
      responses:
        '201': { description: Created; the token is shown once, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, pattern: '^echo_dt_' } } } } } }
        '400': { description: No device name }
        '401': { description: 'Wrong credentials (generic), totp_required, or bad_code' }
        '429': { description: Rate limited }

  /invite:
    get:
      summary: Whether redeeming an invite will ask for TOTP enrolment
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [requireTotp], properties: { requireTotp: { type: boolean } } } } } }
    post:
      summary: 'Redeem an invite (§4.2): single use, 72 h. Without "require TOTP for all" this creates the user and signs them in'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                username: { type: string, description: Ignored when the invite presets one }
                password: { type: string, minLength: 12 }
      responses:
        '200':
          description: 'Created (totpRequired false, session cookie set), or the TOTP key to enrol first'
          content: { application/json: { schema: { type: object, required: [totpRequired], properties: { totpRequired: { type: boolean }, otpauth: { type: string }, secret: { type: string } } } } }
        '400': { description: Bad username or password }
        '404': { description: Unknown, used or expired invite }
        '409': { description: Username taken }
        '429': { description: Rate limited }
  /invite/totp:
    post:
      summary: 'Redeem step 2 when TOTP is required: a valid code creates the user; recovery codes are shown once'
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, code], properties: { token: { type: string }, code: { type: string } } } } }
      responses:
        '200': { description: Created and signed in, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { description: Wrong code }
        '404': { description: Unknown, used or expired invite }

  /auth/logout:
    post:
      summary: Ends this session
      responses:
        '200': { description: OK }

  /me:
    get:
      summary: The signed-in user
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { username: { type: string }, role: { enum: [admin, user] } } } } } }
    delete:
      summary: 'Delete the account (§10, ACC-03): password, and the code when TOTP is on; everything of the user goes'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordAndCode' } } }
      responses:
        '200': { description: Deleted; the session cookie is cleared }
        '403': { description: Wrong password or code }
        '409': { description: The last admin }
        '423': { description: 'locked: too many wrong passwords or codes (the account lockout)' }
        '429': { description: 'rate_limited: too many attempts from this address' }

  /me/connections/navidrome:
    get:
      summary: The user's Navidrome connection (the secret is never returned)
      responses:
        '200':
          description: Connected or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  defaultUrl: { type: [string, 'null'] }
                  url: { type: string }
                  username: { type: string }
                  auth: { enum: [password, apiKey] }
                  serverVersion: { type: string }
                  extensions: { type: array, items: { type: string } }
                  secretSaved: { type: boolean }
    put:
      summary: Connect (tested before anything is stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, description: 'Defaults to ECHO_NAVIDROME_URL; otherwise https and public, unless allow-listed' }
                username: { type: string }
                password: { type: string }
                apiKey: { type: string, description: Instead of username and password, when the server supports it }
      responses:
        '200': { description: Connected, content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Disconnect
      responses:
        '200': { description: OK }

  /me/connections/navidrome/test:
    post:
      summary: Test the stored connection
      responses:
        '200': { description: Reachable, content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Not connected }

  /navidrome/rest/{method}:
    parameters:
      - { name: method, in: path, required: true, schema: { type: string } }
    get:
      summary: Allow-listed Subsonic read methods, signed with the user's own credentials
      description: >
        ping, getOpenSubsonicExtensions, getLicense, getScanStatus, getArtists, getArtist, getAlbum,
        getAlbumList2, getSong, getPlaylists, getPlaylist, getStarred2, search3, getLyrics,
        getLyricsBySongId. Query parameters pass through, except auth and protocol ones.
      responses:
        '200': { description: The Subsonic response (`subsonic-response`) }
        '403': { description: Method not allowed }
        '409': { description: Not connected }
        '502': { $ref: '#/components/responses/Problem' }
    post:
      summary: Allow-listed Subsonic methods that change state (star, unstar, scrobble), POST only so the Origin check applies
      responses:
        '200': { description: The Subsonic response }
        '403': { description: Method not allowed }
        '409': { description: Not connected }
        '502': { $ref: '#/components/responses/Problem' }

  /navidrome/stream/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, examples: [raw, opus] } }
      - { name: maxBitRate, in: query, schema: { type: integer } }
      - { name: timeOffset, in: query, schema: { type: integer }, description: Seconds, for transcodes }
      - { name: uid, in: query, schema: { type: integer }, description: Signed URL (with exp and sig) }
      - { name: exp, in: query, schema: { type: integer } }
      - { name: sig, in: query, schema: { type: string } }
    get:
      summary: Audio stream, Range passed through, unbuffered (a session, a device token, or a signed URL)
      security: [{ session: [] }, { device: [] }, {}]
      responses:
        '200': { description: Audio (audio/* only; anything else becomes application/octet-stream) }
        '206': { description: Partial content }
        '401': { description: No session and no valid signature }
        '409': { description: Not connected }
        '502': { description: Navidrome failed or answered with an error }

  /navidrome/stream-url/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: A signed stream URL for clients that can send neither cookie nor header (6 h, one track, one user)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string }, expiresAt: { type: integer } } } } } }
        '409': { description: 'navidrome.not_connected: the user has no Navidrome' }

  /navidrome/cover/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: size, in: query, schema: { type: integer, minimum: 16, maximum: 2048 } }
    get:
      summary: Cover art (raster images only), cached privately for a week
      responses:
        '200': { description: Image }
        '409': { description: Not connected }
        '502': { description: Navidrome failed }

  /palette/{albumKey}:
    parameters:
      - { name: albumKey, in: path, required: true, schema: { type: string, pattern: '^[\w:.-]{1,200}$' } }
    get:
      summary: The album's palette (docs/VISUALIZER_SPEC.md §6), computed on a miss and cached per Navidrome server
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Palette' } } } }
        '400': { description: Bad album key }
        '401': { description: No session (development servers answer for generated covers) }

  /me/queue:
    get:
      summary: The user's saved queue
      responses:
        '200':
          description: OK (queue null when none)
          content: { application/json: { schema: { type: object, properties: { queue: { type: [object, 'null'] }, positionMs: { type: number }, updatedAt: { type: integer } } } } }
    put:
      summary: Save the queue (compare-and-set on updatedAt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queue, baseUpdatedAt]
              properties:
                queue: { type: [object, 'null'], description: null clears the saved queue }
                positionMs: { type: number }
                baseUpdatedAt: { type: integer, description: The updatedAt this device last saw }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer } } } } } }
        '400': { description: Not a queue }
        '409': { description: 'changed_elsewhere: a newer queue from another device (returned)' }

  /me/queue/youtube:
    get:
      summary: The user's saved queue that holds YouTube songs (web only; Android never reads it)
      responses:
        '200':
          description: OK (queue null when none)
          content: { application/json: { schema: { type: object, properties: { queue: { type: [object, 'null'] }, positionMs: { type: number }, updatedAt: { type: integer } } } } }
    put:
      summary: Save a queue that holds YouTube songs (compare-and-set on updatedAt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queue, baseUpdatedAt]
              properties:
                queue: { type: [object, 'null'], description: null clears the saved queue }
                positionMs: { type: number }
                baseUpdatedAt: { type: integer, description: The updatedAt this device last saw }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, properties: { updatedAt: { type: integer } } } } } }
        '400': { description: Not a queue }
        '409': { description: 'changed_elsewhere: a newer queue from another device (returned)' }

  /wanted:
    get:
      summary: The Wanted list, newest first; what is still missing is looked for first (an item at most every 10 minutes), when the user's Navidrome is the server's own (the default, else the first admin's)
      description: One list for everyone on the server. An item is found when an album, else a song, has every word of its text in its artist and title.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WantedItem' } } } } }
    post:
      summary: Add to the Wanted list; the same words (case, accents and punctuation aside) are the same item
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 200 } } }
      responses:
        '201': { description: Added (and looked for at once), content: { application/json: { schema: { $ref: '#/components/schemas/WantedItem' } } } }
        '200': { description: Already on the list, content: { application/json: { schema: { $ref: '#/components/schemas/WantedItem' } } } }
        '400': { description: 'bad_wanted: empty, without words, or over 200 characters' }
        '409': { description: 'wanted_full: the user already has 200 items on the list' }
  /wanted/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Remove an item (anyone may; the list is shared)
      responses:
        '200': { description: Removed }
        '404': { description: No such item }
  /me/plays:
    post:
      summary: Record a play (a Navidrome song past its scrobble point) for the user's history
      description: The history feeds Made For You, Jump back in and Wrapped; plays older than two years are dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track]
              properties:
                track: { type: object, description: 'The client''s Track (provider navidrome); a cover is kept only from /api/v1/navidrome/cover/' }
                context: { type: object, properties: { kind: { type: string }, id: { type: string }, title: { type: string } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        '400': { description: 'bad_play: not a Navidrome song with a title and an artist' }

  /me/plays/recent:
    get:
      summary: Songs played lately, each once, latest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { tracks: { type: array, items: { $ref: '#/components/schemas/TrackRef' } } } } } } }

  /me/plays/contexts:
    get:
      summary: '"Jump back in": albums, playlists, artists and mixes played from lately'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contexts:
                    type: array
                    items: { type: object, required: [kind, id, at], properties: { kind: { type: string }, id: { type: string }, title: { type: string }, cover: { type: string }, at: { type: integer } } }

  /me/mixes:
    get:
      summary: Made For You — Daily Mixes, Discover Weekly, On Repeat, Repeat Rewind and the daylist
      description: Made from the user's plays and their Navidrome (top songs, similar artists); rebuilt daily.
      parameters:
        - { name: tz, in: query, description: 'The client''s UTC offset in minutes, as getTimezoneOffset gives it (for the daylist)', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mixes:
                    type: array
                    items: { type: object, required: [id, kind, title, subtitle, tracks], properties: { id: { type: string }, kind: { type: string }, title: { type: string }, subtitle: { type: string }, tracks: { type: array, items: { $ref: '#/components/schemas/TrackRef' } } } }

  /me/wrapped:
    get:
      summary: A year in review (UTC)
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 3000 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [year, minutes, plays], properties: { year: { type: integer }, minutes: { type: integer }, plays: { type: integer }, artists: { type: array }, tracks: { type: array }, albums: { type: array }, topDay: { type: [object, 'null'] }, distinctArtists: { type: integer } } } } } }
        '400': { description: bad_year }

  /lyrics:
    get:
      summary: The track's lyrics (cache first, then the sources), with the user's override for it
      description: Provider ids are taken from trackKey (navidrome:<id>); the metadata is part of the shared cache key.
      parameters:
        - { name: trackKey, in: query, required: true, schema: { type: string, pattern: '^[\w:.-]{1,200}$' } }
        - { name: title, in: query, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: durationMs, in: query, schema: { type: integer } }
        - { name: isrc, in: query, description: 'Navidrome tracks: lets the server find a Spotify id for Spicy Lyrics, with the user''s opt-in (LYRICS_INTEGRATION.md §4.3)', schema: { type: string, pattern: '^[A-Za-z]{2}[A-Za-z0-9]{3}[0-9]{7}$' } }
      responses:
        '200':
          description: Found
          content: { application/json: { schema: { type: object, properties: { doc: { $ref: '#/components/schemas/LyricsDoc' }, override: { $ref: '#/components/schemas/Override' } } } } }
        '400': { description: Bad track key }
        '404':
          description: No source had lyrics (the sources tried, with their outcomes)
          content: { application/json: { schema: { type: object, properties: { tried: { type: array, items: { type: object, properties: { source: { type: string }, outcome: { type: string } } } }, override: { $ref: '#/components/schemas/Override' } } } } }

  /me/account:
    get:
      summary: The signed-in user's account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [username, role, createdAt, totpEnabled, recoveryCodesLeft]
                properties:
                  username: { type: string }
                  role: { enum: [admin, user] }
                  createdAt: { type: integer }
                  totpEnabled: { type: boolean }
                  recoveryCodesLeft: { type: integer }
  /me/password:
    post:
      summary: Change the password (§4.3); every other session and device is signed out
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current, next], properties: { current: { type: string }, next: { type: string, minLength: 12 } } } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { type: object, required: [ok, revoked], properties: { ok: { const: true }, revoked: { type: integer } } } } } }
        '400': { description: The new password breaks the policy }
        '403': { description: Wrong current password }
        '423': { description: 'locked: too many wrong passwords or codes (the account lockout)' }
        '429': { description: 'rate_limited: too many attempts from this address' }
  /me/sessions:
    get:
      summary: Sessions & devices (§4.6), the user's own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, createdAt, lastSeenAt, current]
                  properties:
                    id: { type: string, description: The stored hash (it cannot sign anyone in) }
                    kind: { enum: [web, device] }
                    name: { type: [string, 'null'] }
                    createdAt: { type: integer }
                    lastSeenAt: { type: integer }
                    location: { type: [string, 'null'], description: 'IPv4 /24 or IPv6 /48' }
                    current: { type: boolean }
  /me/sessions/{id}:
    delete:
      summary: Revoke one of the user's own sessions or devices
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Revoked }
        '404': { description: Not one of the user's }
  /me/sessions/revoke-others:
    post:
      summary: Sign out everywhere else
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { type: object, required: [ok, revoked], properties: { ok: { const: true }, revoked: { type: integer } } } } } }
  /me/totp/start:
    post:
      summary: 'Begin TOTP enrolment (password): the key, kept 10 min until a code confirms it'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '200': { description: The key, content: { application/json: { schema: { type: object, required: [otpauth, secret], properties: { otpauth: { type: string }, secret: { type: string } } } } } }
        '403': { description: Wrong password }
        '409': { description: TOTP is already on }
        '423': { description: 'locked: too many wrong passwords or codes (the account lockout)' }
        '429': { description: 'rate_limited: too many attempts from this address' }
  /me/totp/enable:
    post:
      summary: Confirm enrolment with one valid code; recovery codes are shown once
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: On, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { description: Wrong code }
        '409': { description: No enrolment in progress, or it expired }
  /me/totp/disable:
    post:
      summary: Turn TOTP off (password + a current code); not for admins
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordAndCode' } } }
      responses:
        '200': { description: Off }
        '403': { description: 'Wrong password or code, or an admin (admins keep TOTP)' }
        '423': { description: 'locked: too many wrong passwords or codes (the account lockout)' }
        '429': { description: 'rate_limited: too many attempts from this address' }
  /me/recovery-codes:
    post:
      summary: New recovery codes (password + a current code); the old ones stop working
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordAndCode' } } }
      responses:
        '200': { description: New codes, shown once, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '403': { description: Wrong password or code }
        '423': { description: 'locked: too many wrong passwords or codes (the account lockout)' }
        '429': { description: 'rate_limited: too many attempts from this address' }
  /me/settings:
    get:
      summary: The user's preferences that follow them (SETTINGS_AND_SECURITY.md §7.1; M7 has one)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } } }
    put:
      summary: Change preferences (only known keys; anything else is refused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lyrics: { type: object, additionalProperties: false, properties: { disabledSources: { type: array, uniqueItems: true, items: { enum: [navidrome, spicy, netease, lrclib, navidrome-plain] }, description: Lyric sources the user turned off } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/UserSettings' } } } }
        '400': { description: An unknown key or a wrong type }

  /me/tracks/{trackKey}/override:
    parameters:
      - { name: trackKey, in: path, required: true, schema: { type: string } }
    get:
      summary: The user's timing offset and source pin for a track
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Override' } } } }
        '400': { description: 'bad_track_key: not a track key' }
    put:
      summary: Set the timing offset (±10 s) and/or the source pin (null clears it)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Override' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Override' } } } }
        '400': { description: Out of range or an unknown source }

  /admin/users:
    get:
      summary: Every user (admins only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, username, role, disabled, totpEnabled, createdAt, lockedForMs, connections]
                  properties:
                    id: { type: integer }
                    username: { type: string }
                    role: { enum: [admin, user] }
                    disabled: { type: boolean }
                    totpEnabled: { type: boolean }
                    createdAt: { type: integer }
                    lastSeenAt: { type: [integer, 'null'] }
                    lockedForMs: { type: integer }
                    connections: { type: object, properties: { navidrome: { type: boolean } } }
        '403': { description: Not an admin }
  /admin/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      summary: Promote or demote, disable or enable (disabling signs the user out everywhere)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { role: { enum: [admin, user] }, disabled: { type: boolean } } } } }
      responses:
        '200': { description: Changed }
        '400': { description: Bad value }
        '403': { description: Not an admin }
        '404': { description: No such user }
        '409': { description: 'last_admin, or needs_totp (an admin always has TOTP)' }
    delete:
      summary: Delete another user and all their data
      responses:
        '200': { description: Deleted }
        '403': { description: Not an admin }
        '404': { description: No such user }
        '409': { description: 'Yourself (use DELETE /me) or the last admin' }
  /admin/users/{id}/unlock:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      summary: Lift a login lockout
      responses:
        '200': { description: Unlocked }
        '403': { description: Not an admin }
        '404': { description: No such user }
  /admin/invites:
    get:
      summary: Pending invites
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [id, expiresAt], properties: { id: { type: string }, username: { type: [string, 'null'] }, expiresAt: { type: integer } } } } } } }
        '403': { description: Not an admin }
    post:
      summary: 'A new invite: single use, 72 h; the token is shown once'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { username: { type: string, description: Preset username } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [token, path, expiresAt], properties: { token: { type: string }, path: { type: string }, expiresAt: { type: integer } } } } } }
        '400': { description: Bad username }
        '403': { description: Not an admin }
  /admin/invites/{id}:
    delete:
      summary: Revoke a pending invite
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Revoked }
        '403': { description: Not an admin }
        '404': { description: No such pending invite }
  /admin/audit:
    get:
      summary: The audit log, newest first
      parameters:
        - { name: before, in: query, schema: { type: integer }, description: An entry id; older entries }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [id, at, event], properties: { id: { type: integer }, at: { type: integer }, event: { type: string }, username: { type: [string, 'null'] }, detail: { type: [object, 'null'] } } } } } } }
        '403': { description: Not an admin }

  /admin/spotify-matching:
    get:
      summary: Spotify matching for this admin's Navidrome server (LYRICS_INTEGRATION.md §4.3)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SpotifyMatching' } } } }
        '403': { description: Not an admin }
  /admin/spotify-matching/run:
    post:
      summary: Start a library sweep now (no-op while one runs or when switched off)
      responses:
        '202': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/SpotifyMatching' } } } }
        '403': { description: Not an admin }
  /admin/spotify-matching/misses:
    get:
      summary: Tracks tried without a match, by artist, album, title
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, artist: { type: string }, album: { type: [string, 'null'] }, isrc: { type: [string, 'null'] } } } } } }
        '403': { description: Not an admin }
  /admin/spotify-matching/tracks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The Navidrome track id }
    get:
      summary: One track's match
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SpotifyMatch' } } } }
        '400': { description: 'bad_track_key: not a track id' }
        '403': { description: Not an admin }
    put:
      summary: Correct a track's match for everyone on this Navidrome server
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [spotify], properties: { spotify: { type: [string, 'null'], description: 'A Spotify track link, URI or id; null forgets the match and matches again' } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SpotifyMatch' } } } }
        '400': { description: Not a Spotify track }
        '403': { description: Not an admin }
  /admin/settings:
    get:
      summary: Server settings (admins only); secrets are reported as saved or not, never returned
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } } }
        '403': { description: Not an admin }
    put:
      summary: Change server settings (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lyrics:
                  type: object
                  properties:
                    spicyKey: { type: [string, 'null'], pattern: '^sl_sk_', description: The Spicy Lyrics secret key (null removes it) }
                auth: { type: object, properties: { requireTotpForAll: { type: boolean, description: Users without TOTP must enrol before anything else } } }
                spotify:
                  type: object
                  properties:
                    matchLibrary: { type: boolean, description: Match the Navidrome library with Spotify track ids in the background, for Spicy Lyrics }
                youtube: { type: object, properties: { enabled: { type: boolean, description: YouTube Music mode for everyone (on by default) } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } } }
        '400': { description: Not a secret key, or an unknown setting (the removed Spotify app ones too); nothing was saved }
        '403': { description: Not an admin }

  /me/connections/youtube:
    get:
      summary: The user's YouTube Music sign-in (the cookie is never returned)
      responses:
        '200':
          description: Signed in or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  name: { type: string, description: The Google account's name }
                  needsReentry: { type: boolean, description: Restored without the master key; paste the cookie again }
    put:
      summary: Sign in by pasting the Cookie header of a signed-in music.youtube.com tab; stored sealed only once YouTube accepts it
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [cookie], properties: { cookie: { type: string, maxLength: 8192, description: Must hold SAPISID or __Secure-3PAPISID } } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
        '400': { description: 'youtube.input (not a whole Cookie header) or youtube.signed_out (YouTube did not accept it); nothing stored', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
    delete:
      summary: Sign out of YouTube Music (the sealed cookie is deleted)
      responses:
        '200': { description: Signed out }
  /admin/youtube:
    get:
      summary: yt-dlp's version, its last update and its last error (admins only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { version: { type: [string, 'null'] }, updatedAt: { type: [integer, 'null'] }, lastError: { type: [string, 'null'] } } } } } }
        '403': { description: Not an admin }
  /youtube/home:
    get:
      summary: YouTube Music's Home (personal when signed in, general when not)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/explore:
    get:
      summary: New releases, charts, moods and genres
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/library:
    get:
      summary: The user's playlists, Liked music, albums and artists (signed in only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/search:
    parameters:
      - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      - { name: tab, in: query, schema: { enum: [all, songs, albums, artists, playlists], default: all } }
    get:
      summary: Search, grouped by kind
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '400': { description: No query, or an unknown tab }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/suggest:
    parameters:
      - { name: q, in: query, required: true, schema: { type: string } }
    get:
      summary: Search suggestions as the user types
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: string } } } } } } }
  /youtube/album/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{2,64}$' } }
    get:
      summary: "An album: its songs, and more by the artist"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '400': { description: Not an id }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/artist/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{2,64}$' } }
    get:
      summary: "An artist: top songs, albums, singles"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '400': { description: Not an id }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/playlist/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{2,64}$' } }
    get:
      summary: "A playlist's songs (VLLM: the user's Liked music)"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '400': { description: Not an id }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/up-next/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    get:
      summary: The song's radio (YouTube's Up next automix), the song first
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { tracks: { type: array, items: { type: object } } } } } } }
        '400': { description: Not an id }
        '404': { description: youtube.disabled, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/related/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    get:
      summary: Songs, playlists and artists like this song
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/YtPage' } } } }
        '400': { description: Not an id }
        '404': { description: 'youtube.disabled (the admin switch is off), or youtube.not_found', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '409': { description: 'youtube.signed_out: sign in (again) in Settings', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
        '502': { description: YouTube Music did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/lyrics/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    get:
      summary: YouTube Music's own plain lyrics (the fallback when ECHO's lyric sources find none)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { text: { type: string }, source: { type: string } } } } } }
        '400': { description: Not an id }
        '404': { description: No lyrics, or youtube.disabled }
  /youtube/like/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    get:
      summary: Whether the user likes the song on YouTube Music (false when signed out)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { like: { type: boolean } } } } } }
        '400': { description: Not an id }
        '409': { description: youtube.signed_out (a stale sign-in), content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
    put:
      summary: Like a song on the user's YouTube Music account, or take the like back
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [like], properties: { like: { type: boolean } } } } }
      responses:
        '200': { description: Done, content: { application/json: { schema: { type: object, properties: { like: { type: boolean } } } } } }
        '400': { description: Not an id, or like is not a boolean }
        '409': { description: youtube.signed_out, content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/played/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    post:
      summary: A play, added to the user's YouTube history when signed in (never fails the player)
      responses:
        '204': { description: Noted }
        '400': { description: Not an id }
  /youtube/prepare:
    post:
      summary: Resolve up to three songs' audio ahead, so they start without waiting for yt-dlp
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, maxItems: 3, items: { type: string, pattern: '^[\w-]{11}$' } } } } } }
      responses:
        '202': { description: Resolving in the background }
        '400': { description: Not up to three video ids }
  /youtube/stream/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$', description: A video id } }
    get:
      summary: "A song's audio through ECHO (yt-dlp, anonymous): Range in, 206 out, at most 10 MiB per answer"
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        '206': { description: The bytes asked for (audio/mp4) }
        '400': { description: Not an id }
        '416': { description: The range starts past the end }
        '502': { description: 'youtube.unavailable, youtube.bot_check or youtube.failed', content: { application/json: { schema: { $ref: '#/components/schemas/YtProblem' } } } }
  /youtube/image:
    get:
      summary: A YouTube Music thumbnail through ECHO (the CSP keeps img-src 'self'); YouTube's image hosts only
      parameters:
        - { name: u, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        '200': { description: A raster image }
        '400': { description: Not https on an allowed host }
        '502': { description: Not an image, or no answer }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-echo_session }
    device: { type: http, scheme: bearer, bearerFormat: echo_dt_… }
  schemas:
    TrackRef:
      type: object
      required: [id, title, artist, album, durationMs]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        artistId: { type: string }
        album: { type: string }
        albumId: { type: string }
        durationMs: { type: integer }
        cover: { type: string }
    Override:
      type: object
      properties:
        offsetMs: { type: integer, minimum: -10000, maximum: 10000 }
        pinnedSource: { enum: [navidrome, spicy, netease, lrclib, navidrome-plain, null] }
    LyricsDoc:
      type: object
      description: docs/LYRICS_INTEGRATION.md §5 (version 1)
      required: [version, trackKey, sync, source, attribution, offsetMs, lines, fetchedAt]
      properties:
        version: { const: 1 }
        trackKey: { type: string }
        sync: { enum: [word, line, none] }
        source: { enum: [navidrome, spicy, netease, lrclib, navidrome-plain, fixture] }
        attribution: { type: object, properties: { text: { type: string }, links: { type: array, items: { type: object, properties: { label: { type: string }, href: { type: string } } } } } }
        offsetMs: { type: integer }
        lines: { type: array, items: { type: object } }
        fetchedAt: { type: string, format: date-time }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties: { recoveryCodes: { type: array, minItems: 10, maxItems: 10, items: { type: string, pattern: '^[a-z2-9]{4}-[a-z2-9]{4}-[a-z2-9]{4}$' } } }
    PasswordAndCode:
      type: object
      required: [password]
      properties: { password: { type: string }, code: { type: string, description: TOTP or recovery code } }
    UserSettings:
      type: object
      properties:
        version: { const: 2 }
        lyrics: { type: object, properties: { disabledSources: { type: array, uniqueItems: true, items: { enum: [navidrome, spicy, netease, lrclib, navidrome-plain] }, description: Lyric sources the user turned off, default: [] } } }
    WantedItem:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        addedBy: { type: [string, 'null'], description: The username; null once that user is deleted }
        addedAt: { type: integer }
        found:
          type: [object, 'null']
          properties:
            kind: { enum: [album, song] }
            id: { type: string }
            title: { type: string }
            artist: { type: string }
            albumId: { type: string, description: A song's album }
    AdminSettings:
      type: object
      properties:
        lyrics: { type: object, properties: { spicyKeySaved: { type: boolean } } }
        auth: { type: object, properties: { requireTotpForAll: { type: boolean } } }
        spotify:
          type: object
          properties:
            matchLibrary: { type: boolean }
        youtube: { type: object, properties: { enabled: { type: boolean } } }
    YtItem:
      type: object
      required: [kind, id, title, subtitle, thumb]
      properties:
        kind: { enum: [song, video, album, playlist, artist] }
        id: { type: string, description: The video id (song, video) or browse id (album, artist, playlist) }
        title: { type: string }
        subtitle: { type: string }
        thumb: { type: string, description: Through /youtube/image, or empty }
        track: { type: object, description: The playable Track (provider youtube) of a song or video }
    YtPage:
      type: object
      required: [title, shelves]
      properties:
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        thumb: { type: string }
        kind: { enum: [song, video, album, playlist, artist] }
        id: { type: string }
        tracks: { type: array, items: { type: object }, description: What Play plays }
        shelves:
          type: array
          items:
            type: object
            required: [title, layout, items]
            properties:
              title: { type: string }
              strapline: { type: string }
              layout: { enum: [rows, cards] }
              items: { type: array, items: { $ref: '#/components/schemas/YtItem' } }
    YtProblem:
      type: object
      properties:
        code: { enum: [youtube.signed_out, youtube.disabled, youtube.not_found, youtube.failed, youtube.unavailable, youtube.bot_check, youtube.input] }
        stale: { type: boolean, description: A sign-in is saved but YouTube no longer accepts it }
        userMessage: { type: string }
    SpotifyMatching:
      type: object
      properties:
        status:
          type: object
          properties:
            running: { type: boolean }
            phase: { enum: [scan, musicbrainz, null] }
            scanned: { type: integer }
            startedAt: { type: [integer, 'null'] }
            finishedAt: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
        counts:
          type: object
          properties: { tracks: { type: integer }, matched: { type: integer }, manual: { type: integer }, none: { type: integer }, pending: { type: integer } }
    SpotifyMatch:
      type: object
      properties:
        match:
          type: [object, 'null']
          properties:
            ids: { type: array, items: { type: string, pattern: '^[0-9A-Za-z]{22}$' } }
            method: { enum: [manual, spotify, lb-mbid, lb-meta, null] }
            tried: { type: array, items: { enum: [spotify, lb-mbid, lb-meta] } }
    ServerInfo:
      type: object
      properties:
        serverInfo:
          type: object
          properties:
            type: { type: string }
            serverVersion: { type: string }
            tracks: { type: integer }
            extensions: { type: array, items: { type: string } }
    Palette:
      type: object
      properties:
        room: { type: string, description: CSS oklch() }
        accent: { type: string }
        highlight: { type: string }
        glow: { type: string, description: With its alpha }
        shadow: { type: string }
        inkActive: { type: string }
        source: { enum: [art, fallback] }
        version: { type: integer }
  responses:
    Error:
      description: An error code
      content: { application/json: { schema: { type: object, properties: { error: { type: string }, detail: { type: string } } } } }
    Problem:
      description: A code and a message for the user
      content: { application/json: { schema: { type: object, properties: { code: { type: string }, userMessage: { type: string } } } } }
