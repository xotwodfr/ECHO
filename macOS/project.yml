# ECHO for macOS. XcodeGen makes the Xcode project from this file:
#   brew install xcodegen && xcodegen && open ECHO.xcodeproj
# The app's code is shared with iOS/ (Apple/Shared); this folder holds what is the Mac's own.
name: ECHO
options:
  bundleIdPrefix: com.folk3s
  deploymentTarget:
    macOS: "26.0"
targets:
  ECHO:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../Apple/Shared
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ECHO
        LSApplicationCategoryType: public.app-category.music
        # Test servers on this network (ECHO_URL=http://…); everything else stays https only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folk3s.echo.mac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        # The Icon Composer icon in Apple/Shared (Liquid Glass layers), compiled by actool.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The Swift tests (Swift Testing, Apple/Tests): the API client, models, sign-in and the library
  # (hearts, the sorts, Wanted's Undo, the cover cache) against the server's recorded answers
  # (Apple/Tests/Fixtures, scripts/apple-fixtures.ts). A bundle of its own with the API and library
  # code compiled in, so no app has to launch; run by .github/workflows/apple.yml.
  ECHOTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Apple/Shared/Api
      - path: ../Apple/Shared/Library
      - path: ../Apple/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folk3s.echo.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
schemes:
  ECHOTests:
    build:
      targets:
        ECHOTests: [test]
    test:
      targets: [ECHOTests]
