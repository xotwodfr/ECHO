# Supply-chain rules (docs/SETTINGS_AND_SECURITY.md §12).
# Only these packages may run install scripts (prebuilt native binaries).
allowBuilds:
  better-sqlite3: true
  sharp: true
# Versions must be at least two weeks old (docs/TECHNICAL_ARCHITECTURE.md §3).
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - '@pnpm/exe.android-arm64@12.11.2'
  - '@pnpm/exe.android-x64@12.11.2'
  - '@pnpm/exe.darwin-arm64@12.11.2'
  - '@pnpm/exe.darwin-x64@12.11.2'
  - '@pnpm/exe.freebsd-x64@12.11.2'
  - '@pnpm/exe.linux-arm64-musl@12.11.2'
  - '@pnpm/exe.linux-arm64@12.11.2'
  - '@pnpm/exe.linux-ppc64@12.11.2'
  - '@pnpm/exe.linux-riscv64@12.11.2'
  - '@pnpm/exe.linux-s390x@12.11.2'
  - '@pnpm/exe.linux-x64-musl@12.11.2'
  - '@pnpm/exe.linux-x64@12.11.2'
  - '@pnpm/exe.win32-arm64@12.11.2'
  - '@pnpm/exe.win32-x64@12.11.2'
  - pnpm@12.11.2
patchedDependencies:
  '@material/material-color-utilities@0.4.0': patches/@material__material-color-utilities@0.4.0.patch
strictDepBuilds: true
