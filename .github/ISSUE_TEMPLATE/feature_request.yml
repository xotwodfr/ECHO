name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the feature and why it would be valuable.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: "When I'm listening to an album, I want to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work? Any UI/UX considerations?
      placeholder: "Add a button in the Now Playing screen that..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other ways to solve this, or why existing features don't work

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / Queue
        - Library / Search
        - Lyrics / Karaoke
        - Visualizer / Stage
        - YouTube Music mode
        - Together (listen together)
        - Offline / Downloads
        - Settings / Account
        - Android app
        - Desktop apps (Linux/Windows/macOS)
        - iOS/macOS app
        - Server / API
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and discussions
        - label: This aligns with ECHO's scope (self-hosted, Navidrome-first, immersive)
        - label: I'm willing to help test or contribute