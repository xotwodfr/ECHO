name: apple

# ECHO for iPhone and Mac (iOS/, macOS/, Apple/Shared): built unsigned on the macOS 26 runner with
# Xcode 26, the Swift tests (Apple/Tests, Swift Testing) run on the Mac and in the iOS 26 simulator,
# then every screen (launch argument -ECHODemo, Apple/Shared/Preview) is screenshotted in the
# simulator and on the runner's Mac. The builds, screenshots and test logs are uploaded, and on a
# branch the screenshots are committed back under Apple/Screenshots, where the sessions that work on
# this repository (which cannot download artifacts) see them. A failed test fails the run, after the
# screenshots are in. A push by this workflow's token starts no workflow, so that commit does not
# run it again.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Apple/**'
      - 'iOS/**'
      - 'macOS/**'
      - '.github/workflows/apple.yml'
      - '!**/*.md'
      - '!Apple/Screenshots/**'
  workflow_dispatch:

permissions:
  contents: write # the screenshots' commit

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xc" ]; then sudo xcode-select -s "$xc"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Projects
        run: |
          brew install xcodegen
          xcodegen --version
          (cd iOS && xcodegen)
          (cd macOS && xcodegen)
          # The Icon Composer icon is a folder Xcode compiles with actool only as folder.iconcomposer.icon.
          for p in iOS/ECHO.xcodeproj/project.pbxproj macOS/ECHO.xcodeproj/project.pbxproj; do
            sed -i '' -E 's/(lastKnownFileType = )[^;]*(; (name = AppIcon\.icon; )?path = [^;]*AppIcon\.icon;)/\1folder.iconcomposer.icon\2/' "$p"
            sed -i '' -E 's/(isa = PBXFileReference; )((name = AppIcon\.icon; )?path = [^;]*AppIcon\.icon;)/\1lastKnownFileType = folder.iconcomposer.icon; \2/' "$p"
            grep -n "AppIcon" "$p"
          done

      - name: Build for iPhone (simulator, unsigned)
        run: >
          xcodebuild -quiet -project iOS/ECHO.xcodeproj -target ECHO -configuration Debug
          -sdk iphonesimulator ARCHS=arm64 SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO

      - name: The widget extension and its App Group in the build
        run: |
          app=build/ios/Debug-iphonesimulator/ECHO.app
          ls "$app/PlugIns" || echo "no PlugIns"
          plutil -p "$app/PlugIns/ECHOWidget.appex/Info.plist" | grep -E "CFBundleIdentifier|NSExtension|PointIdentifier|CFBundleShortVersion" || true
          plutil -p "$app/Info.plist" | grep -A6 CFBundleURLTypes || true
          # Entitlements: signed in the binary (none, unsigned), or simulated in a __TEXT,__entitlements section.
          for bin in "$app/ECHO" "$app/PlugIns/ECHOWidget.appex/ECHOWidget"; do
            echo "== $bin"
            codesign -d --entitlements - "$bin" 2>&1 | head -12 || true
            otool -l "$bin" > /tmp/load-commands.txt || true
            if grep -q "sectname __entitlements" /tmp/load-commands.txt; then
              otool -X -s __TEXT __entitlements "$bin" | xxd -r -p | head -20 || true
            else
              echo "no __entitlements section"
            fi
          done
          find build/ios -name "*.xcent" 2>/dev/null | head -6 || true
          find "$app" -maxdepth 3 -name "*.appintents" | head -4 || true

      - name: Build for Mac (ad-hoc signed, so it runs here)
        run: >
          xcodebuild -quiet -project macOS/ECHO.xcodeproj -target ECHO -configuration Debug ONLY_ACTIVE_ARCH=NO
          SYMROOT="$PWD/build/mac" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

      - name: Tests on the Mac (Swift Testing)
        id: mac_tests
        continue-on-error: true # the screenshots still come; the last step fails the run
        run: |
          mkdir -p build/logs
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          limit 1200 xcodebuild test -project macOS/ECHO.xcodeproj -scheme ECHOTests -destination 'platform=macOS' \
            -derivedDataPath build/tests-mac CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            > build/logs/tests-mac.log 2>&1 && status=0 || status=$?
          # Each test's result (skipped ones too), every issue with its expectation, and any compile
          # error or Swift warning.
          grep -E '✔|✘|◇|↳|➜|Test case|Test run|recorded an issue|Expectation failed|error:|\.swift:[0-9]+:[0-9]+: warning:|\*\* TEST' build/logs/tests-mac.log | tail -400 || true
          if [ "$status" != 0 ]; then echo "::error::Mac tests: xcodebuild exited $status"; tail -60 build/logs/tests-mac.log; fi
          exit "$status"

      - name: The icon in the builds
        run: |
          for app in build/ios/Debug-iphonesimulator/ECHO.app build/mac/Debug/ECHO.app; do
            echo "== $app"
            ls "$app" "$app/Contents/Resources" 2>/dev/null | head -40 || true
            plist="$app/Info.plist"; [ -f "$plist" ] || plist="$app/Contents/Info.plist"
            plutil -p "$plist" | grep -i -A6 icon || echo "no icon keys"
            car=$(find "$app" -name Assets.car | head -1)
            if [ -n "$car" ]; then xcrun --sdk iphoneos assetutil --info "$car" | grep -E '"(Name|RenditionName|AssetType|Idiom|PixelWidth)"' | sort | uniq -c | head -40; else echo "no Assets.car"; fi
          done

      - name: iPhone screenshots
        run: |
          mkdir -p Apple/Screenshots
          dev=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(rt, d) for rt, ds in devices.items() if "iOS-26" in rt for d in ds if d["name"].startswith("iPhone")]
          pro = [p for p in phones if "Pro" in p[1]["name"] and "Max" not in p[1]["name"]] or phones
          print(sorted(pro, key=lambda p: (p[0], p[1]["name"]))[-1][1]["udid"])')
          xcrun simctl list devices | grep "$dev"
          # Every simulator command has a time limit, and the log says when each began: a hang
          # fails here with the culprit named instead of using up the job.
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          export PS4='+ $(date +%T) '
          set -x
          limit 300 xcrun simctl boot "$dev"
          limit 600 xcrun simctl bootstatus "$dev" -b || echo "bootstatus gave up; going on"
          limit 60 xcrun simctl ui "$dev" appearance dark
          limit 60 xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          limit 480 xcrun simctl install "$dev" build/ios/Debug-iphonesimulator/ECHO.app
          for s in home shelves album artist playlist mix library albums search wanted mini nowplaying queue lyrics lyrics-interlude lyrics-plain lyrics-menu karaoke karaoke-lyrics karaoke-shelf settings settings-playback settings-lyrics lockcover widgets widgets-tinted widgets-idle signin shell scan approve guest-pass guest-invite guests guest-home themes theme-liquid-glass-home theme-liquid-glass-nowplaying theme-liquid-glass-lyrics theme-light-home theme-apple-music-home theme-apple-music-nowplaying theme-apple-music-lyrics theme-spotify-home theme-spotify-nowplaying theme-spotify-lyrics theme-soundcloud-home theme-soundcloud-nowplaying theme-soundcloud-lyrics theme-deezer-home theme-deezer-nowplaying theme-deezer-lyrics theme-qobuz-home theme-qobuz-nowplaying theme-qobuz-lyrics theme-tidal-home theme-tidal-nowplaying theme-tidal-lyrics theme-youtube-home theme-youtube-nowplaying theme-youtube-lyrics theme-monochrome-home theme-monochrome-nowplaying theme-monochrome-lyrics theme-clay-home theme-clay-nowplaying theme-clay-lyrics theme-clay-dark-home theme-clay-dark-lyrics theme-yarn-home theme-yarn-nowplaying theme-yarn-lyrics theme-paper-home theme-paper-nowplaying theme-paper-lyrics theme-hifi-home theme-hifi-nowplaying theme-hifi-lyrics; do
            f="Apple/Screenshots/iphone-$s.png"
            limit 180 xcrun simctl launch --terminate-running-process "$dev" com.folk3s.echo -ECHODemo "$s"
            # A slow first frame leaves the shot black (lyrics, run 7): a black PNG is a few dozen KB,
            # a drawn screen over a megabyte. Wait longer and take it again.
            for wait in 7 15 30; do
              sleep "$wait"
              limit 120 xcrun simctl io "$dev" screenshot "$f"
              [ "$(stat -f%z "$f")" -gt 300000 ] && break
              echo "::warning::$f is $(stat -f%z "$f") bytes after ${wait}s; it looks blank"
            done
          done
          set +x
          sips --resampleWidth 804 Apple/Screenshots/iphone-*.png >/dev/null
          echo "$dev" > /tmp/sim-udid

      - name: The App Group in the simulator
        run: |
          dev=$(cat /tmp/sim-udid)
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          # The group containers the simulator made for the app (none: its entitlements were not taken).
          limit 60 xcrun simctl get_app_container "$dev" com.folk3s.echo groups || echo "no group containers for the app"
          # What the app was given at launch (WidgetStore.describeAppGroup, logged by each -ECHODemo launch).
          limit 120 xcrun simctl spawn "$dev" log show --last 30m --style compact \
            --predicate 'subsystem == "com.folk3s.echo" AND category == "widget"' | tail -8 || true
          # Whether the system knows the widget extension.
          limit 60 xcrun simctl spawn "$dev" pluginkit -m -v -p com.apple.widgetkit-extension 2>&1 | grep -i echo || echo "pluginkit lists no ECHO widget"

      - name: The App Group in an ad-hoc signed build (the simulator)
        # What the unsigned build cannot show: whether signing alone (no developer account) gives the
        # app its App Group in the simulator. It takes the unsigned app's place for the steps after.
        continue-on-error: true
        run: |
          dev=$(cat /tmp/sim-udid)
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          limit 600 xcodebuild -quiet -project iOS/ECHO.xcodeproj -target ECHO -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 SYMROOT="$PWD/build/ios-adhoc" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          app=build/ios-adhoc/Debug-iphonesimulator/ECHO.app
          for bin in "$app/ECHO" "$app/PlugIns/ECHOWidget.appex/ECHOWidget"; do
            echo "== $bin"
            codesign -d --entitlements - "$bin" 2>&1 | tail -6 || true
          done
          limit 480 xcrun simctl install "$dev" "$app"
          limit 120 xcrun simctl launch --terminate-running-process "$dev" com.folk3s.echo -ECHODemo widgets-idle
          sleep 8
          limit 60 xcrun simctl get_app_container "$dev" com.folk3s.echo groups || echo "no group containers for the app"
          limit 120 xcrun simctl spawn "$dev" log show --last 1m --style compact \
            --predicate 'subsystem == "com.folk3s.echo" AND category == "widget"' | tail -3 || true
          limit 60 xcrun simctl terminate "$dev" com.folk3s.echo || true

      - name: Icon on the home screen
        run: |
          dev=$(cat /tmp/sim-udid)
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          export PS4='+ $(date +%T) '
          set -x
          mkdir -p Apple/Screenshots/icon
          home=$(xcrun simctl getenv "$dev" HOME)
          state="$home/Library/SpringBoard/IconState.plist"
          xcrun simctl terminate "$dev" com.folk3s.echo 2>/dev/null || true
          # Whether the icon style (default, dark, clear, tinted) is a setting SpringBoard keeps.
          xcrun simctl spawn "$dev" defaults read com.apple.springboard 2>/dev/null | grep -i -E "icon|tint|appearance|style|clear" | head -40 || true
          ls "$home/Library/Preferences" | grep -i -E "springboard|homescreen|icon" || true
          sleep 3
          limit 120 xcrun simctl shutdown "$dev"
          # ECHO first on the first page, so its place is known and it is in every shot.
          python3 - "$state" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          try:
              with open(path, "rb") as f:
                  state = plistlib.load(f)
          except FileNotFoundError:
              print("no IconState.plist"); sys.exit(0)
          lists = state.get("iconLists", [])
          for page in lists:
              while "com.folk3s.echo" in page:
                  page.remove("com.folk3s.echo")
          lists[0].insert(0, "com.folk3s.echo")
          with open(path, "wb") as f:
              plistlib.dump(state, f, fmt=plistlib.FMT_BINARY)
          print("first page:", [x if isinstance(x, str) else "(folder/widget)" for x in lists[0]])
          PY
          limit 300 xcrun simctl boot "$dev"
          limit 600 xcrun simctl bootstatus "$dev" -b || echo "bootstatus gave up; going on"
          limit 60 xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          for mode in light dark; do
            limit 60 xcrun simctl ui "$dev" appearance "$mode"
            sleep 8
            limit 120 xcrun simctl io "$dev" screenshot "Apple/Screenshots/icon/home-$mode.png"
            # The first icon at full resolution (3x): the top-left of the grid, with its label.
            cp "Apple/Screenshots/icon/home-$mode.png" "Apple/Screenshots/icon/icon-$mode.png"
            sips --cropToHeightWidth 600 560 --cropOffset 140 0 "Apple/Screenshots/icon/icon-$mode.png" >/dev/null
          done
          sips -g pixelWidth -g pixelHeight Apple/Screenshots/icon/*.png

      - name: Mac screenshots
        run: |
          app="$PWD/build/mac/Debug/ECHO.app"
          # ECHO's frontmost window; with "smallest", its smallest (the Settings window over the main one).
          cat > /tmp/window.swift <<'EOF'
          import CoreGraphics
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let echo = all.filter { $0[kCGWindowOwnerName as String] as? String == "ECHO" && $0[kCGWindowLayer as String] as? Int == 0 }
          func area(_ w: [String: Any]) -> Double {
              let b = w[kCGWindowBounds as String] as? [String: Double] ?? [:]
              return (b["Width"] ?? 0) * (b["Height"] ?? 0)
          }
          let pick = CommandLine.arguments.dropFirst().first == "smallest" ? echo.min { area($0) < area($1) } : echo.first
          print(pick?[kCGWindowNumber as String] as? Int ?? 0)
          EOF
          for s in home shelves albums album search player karaoke karaoke-lyrics karaoke-shelf lyrics settings settings-playback settings-lyrics signin shell guests themes theme-liquid-glass-home theme-liquid-glass-lyrics theme-apple-music-home theme-spotify-home theme-soundcloud-home theme-deezer-home theme-qobuz-home theme-tidal-home theme-youtube-home theme-monochrome-home theme-clay-home theme-yarn-home theme-clay-lyrics theme-paper-home theme-hifi-home theme-hifi-lyrics; do
            pkill -x ECHO || true
            open -n "$app" --args -ECHODemo "$s"
            sleep 10
            osascript -e 'tell application "System Events" to set frontmost of (first process whose name is "ECHO") to true' || true
            sleep 2
            id=$(swift /tmp/window.swift "$([ "$s" = settings ] || [ "$s" = settings-playback ] || [ "$s" = settings-lyrics ] || [ "$s" = guests ] || [ "$s" = themes ] && echo smallest)" || true)
            echo "window $id"
            if [ -n "$id" ] && [ "$id" != "0" ]; then
              screencapture -x -o -l"$id" "Apple/Screenshots/mac-$s.png" || screencapture -x "Apple/Screenshots/mac-$s.png"
            else
              screencapture -x "Apple/Screenshots/mac-$s.png"
            fi
          done
          pkill -x ECHO || true
          for f in Apple/Screenshots/mac-*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            if [ "$w" -gt 1600 ]; then sips --resampleWidth 1600 "$f" >/dev/null; fi
          done
          ls -la Apple/Screenshots

      - name: Tests in the iPhone simulator (Swift Testing)
        id: ios_tests
        continue-on-error: true
        run: |
          dev=$(cat /tmp/sim-udid)
          mkdir -p build/logs
          limit() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          limit 1500 xcodebuild test -project iOS/ECHO.xcodeproj -scheme ECHOTests \
            -destination "platform=iOS Simulator,id=$dev" -derivedDataPath build/tests-ios CODE_SIGNING_ALLOWED=NO \
            > build/logs/tests-ios.log 2>&1 && status=0 || status=$?
          grep -E '✔|✘|◇|↳|➜|Test case|Test run|recorded an issue|Expectation failed|error:|\.swift:[0-9]+:[0-9]+: warning:|\*\* TEST' build/logs/tests-ios.log | tail -400 || true
          if [ "$status" != 0 ]; then echo "::error::iPhone tests: xcodebuild exited $status"; tail -60 build/logs/tests-ios.log; fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: Apple/Screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: build/logs

      - name: Zip the apps
        run: |
          ditto -c -k --keepParent build/ios/Debug-iphonesimulator/ECHO.app ECHO-iOS-simulator.zip
          ditto -c -k --keepParent build/mac/Debug/ECHO.app ECHO-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: ECHO-*.zip

      - name: Commit the screenshots
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apple/Screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Apple preview screenshots from apple run ${{ github.run_number }}"
          # Anything else the build changed (nothing, normally) is set aside for the rebase.
          git status --short | head -20
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep 5
          done

      # An unsigned device build for sideloading (Sideloadly signs it with the owner's Apple ID):
      # Release, arm64, the widget extension inside, no signing here. Uploaded only from a green run.
      - name: Build for iPhone (device, Release, unsigned)
        run: >
          xcodebuild -quiet -project iOS/ECHO.xcodeproj -target ECHO -configuration Release
          -sdk iphoneos ARCHS=arm64 SYMROOT="$PWD/build/ios-device"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package ECHO.ipa
        run: |
          app=build/ios-device/Release-iphoneos/ECHO.app
          rm -rf Payload ECHO.ipa && mkdir Payload
          ditto "$app" Payload/ECHO.app
          ditto -c -k --keepParent Payload ECHO.ipa
          ls -la ECHO.ipa
          unzip -l ECHO.ipa | grep -E "Payload/ECHO.app/(ECHO|Info.plist)$|ECHOWidget.appex/(ECHOWidget|Info.plist)$"
          lipo -info Payload/ECHO.app/ECHO
          vtool -show-build Payload/ECHO.app/ECHO | grep -E "platform|minos" | head -2

      - uses: actions/upload-artifact@v4
        if: steps.mac_tests.outcome == 'success' && steps.ios_tests.outcome == 'success'
        with:
          name: ECHO-ipa
          path: ECHO.ipa

      - name: The tests passed
        if: always()
        run: |
          echo "Mac: ${{ steps.mac_tests.outcome }}; iPhone simulator: ${{ steps.ios_tests.outcome }}"
          [ "${{ steps.mac_tests.outcome }}" = success ] && [ "${{ steps.ios_tests.outcome }}" = success ]
