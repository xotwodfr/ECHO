name: windows

# ECHO for Windows (Windows/README.md): on a real Windows runner, the tests, the single-file exe, and
# a smoke run whose screenshot shows the app (Cider's shell on the built-in library) as Windows renders it. A tag windows-v* also
# publishes the exe as a pre-release.
on:
  push:
    # Both, or GitHub runs it for only the one named. Paths filter branch pushes; tags always run.
    branches: ['**']
    tags: ['windows-v*']
    paths:
      - 'Windows/**'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # the release, on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Windows/Tests
      - run: >
          dotnet publish Windows/App -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Smoke run
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke-$name.png")
          }
          $p = Start-Process publish\ECHO.exe -ArgumentList '--smoke' -PassThru -RedirectStandardError smoke-stderr.txt
          $null = $p.Handle # without a cached handle, ExitCode is empty after exit
          Start-Sleep -Seconds 5
          Shot 'shell'
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'ECHO did not exit by itself' }
          Get-Content smoke-stderr.txt
          if ($p.ExitCode -ne 0) { throw "ECHO exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke-*
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO
          path: publish/ECHO.exe
      - name: Pre-release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$TAG" publish/ECHO.exe --prerelease --title "ECHO for Windows $TAG" --notes-file Windows/RELEASE.md
