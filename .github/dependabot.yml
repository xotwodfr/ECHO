version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    groups:
      dev-deps:
        patterns:
          - "@types/*"
          - "@biomejs/*"
          - "@playwright/*"
          - "@axe-core/*"
          - "vitest"
          - "typescript"
          - "vite"
          - "yaml"
          - "zustand"
          - "react"
          - "react-dom"
          - "three"
        update-types: ["minor", "patch"]
      prod-deps:
        patterns:
          - "@hono/*"
          - "hono"
          - "better-sqlite3"
          - "sharp"
          - "qrcode-generator"
          - "youtubei.js"
          - "@material/material-color-utilities"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "Linux"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "Android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "android"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "Windows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "dotnet"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "stems"
